server:
  port: 8080

spring:
  application:
    name: predictive-maintenance-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/predictive_maintenance_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours in milliseconds
  mqtt:
    enabled: ${MQTT_ENABLED:true}
    broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: ${MQTT_CLIENT_ID:ipm-backend-subscriber}
    topic-pattern: ${MQTT_TOPIC_PATTERN:factory/+/sensor/+}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}

logging:
  level:
    root: INFO
    com.predictive.maintenance: DEBUG
