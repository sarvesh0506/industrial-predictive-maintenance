version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: ipm-postgres
    restart: always
    environment:
      POSTGRES_DB: predictive_maintenance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d predictive_maintenance_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: ipm-mqtt
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: ipm-ml-service
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ml/anomaly/status')"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ipm-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/predictive_maintenance_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      MQTT_BROKER_URL: tcp://mqtt:1883
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      database:
        condition: service_healthy
      mqtt:
        condition: service_started
      ml-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ipm-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: ipm-simulator
    restart: always
    environment:
      MQTT_BROKER_URL: mqtt
      MQTT_PORT: 1883
      SIMULATOR_NUM_MACHINES: 10
      SIMULATOR_PUBLISH_INTERVAL: 5.0
    depends_on:
      - mqtt
      - backend

volumes:
  postgres_data:
